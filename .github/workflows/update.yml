name: Update list from 123ofnet.com
on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: vinpatel/123ofnet, path: src123 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd src123 && node scripts/build-awesome.mjs ..
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md CONTRIBUTING.md LICENSE CHANGELOG.md categories data .github
          git diff --cached --quiet || (git commit -m "Update list from 123ofnet.com" && git push)
